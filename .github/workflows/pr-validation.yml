name: PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# GitHub-hosted: the repository is public, so standard hosted minutes are
# free. Never route a job to a self-hosted runner: a pull request from a fork
# would execute its code on that machine.
#
# Décision de Kevin du 08/10/2026 : les contrats navigateur se répartissent sur
# des jobs parallèles (près d'une heure en un seul job). Les portes
# déterministes et chaque part démarrent ensemble ; « Repository gates », seul
# contrôle requis par la protection de main, réussit seulement si tous ont
# réussi. Règle tenue par tests/scripts/ci-parallele.test.mjs.
jobs:
  lettrage-generation:
    name: Génération distante des registres lettrage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run regen:generated
        env:
          CF_PAGES: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lettrage-generated
          path: |
            src/data/pages-lastmod.json
            editorial/resources/glossaire/manifest.json
            docs/qa/hub-ressources/metier-fix-c-build-receipt.json
            docs/qa/hub-ressources/metier-fix-c-register.json
            docs/qa/hub-ressources/metier-review-r5/reaffirmation.json
            docs/qa/site-copy-b/preuve-glossaire-metier.json
  portes:
    name: Portes déterministes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The planner reads the integrated publication base, never a draft
          # feature commit. A shallow PR checkout omits origin/main.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Astro and content
        run: npm run check

      - name: Exercise the blog forge
        run: npm run test:blog-pipeline

      - name: Exercise blog frame guards in Chromium
        run: node --test tests/scripts/blog-proof-frame-render.test.mjs

      - name: Exercise guide forge and proof geometry in Chromium
        run: npm run test:guide-forge && npm run test:guide-render

      - name: Exercise CAC proof geometry in Chromium
        run: node --test tests/scripts/accueil-cac-geometry.test.mjs

      - name: Exercise proof renderer ownership in Chromium
        run: node --test tests/scripts/proof-render-ownership.test.mjs

      - name: Build and run deterministic gates
        run: npm run build
        env:
          CF_PAGES: "1"

  verify:
    name: Contrats navigateur (${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    # Two runs exhausted 30 minutes while Chromium was still progressing.
    # Each part rebuilds the site through the Playwright webServer; keep a
    # finite budget that still covers the whole suite in a single part.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser contracts
        # La navigation clavier des tableaux (≈ 33 min sur 44) a ses propres parts, job `clavier`.
        run: npm run test -- --grep-invert 'table-keyboard\.spec' --shard=${{ matrix.part }}/4
        env:
          CF_PAGES: "1"

  clavier:
    name: Clavier des tableaux (${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    # 66 tests d'environ 30 s : seuls dans leur matrice, ils se partagent par test (fullyParallel).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run table keyboard contracts
        run: npm run test -- tests/browser/table-keyboard.spec.ts --shard=${{ matrix.part }}/4
        env:
          CF_PAGES: "1"

  gates:
    name: Repository gates
    needs: [portes, verify, clavier]
    # Sans always(), une porte en échec ferait sauter ce job, et GitHub compte
    # un contrôle requis sauté comme vert.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        run: |
          test "${{ needs.portes.result }}" = success
          test "${{ needs.verify.result }}" = success
          test "${{ needs.clavier.result }}" = success
