name: PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository gates
    # GitHub-hosted: the repository is public, so standard hosted minutes are
    # free. Never route this job to a self-hosted runner: a pull request from
    # a fork would execute its code on that machine.
    runs-on: ubuntu-latest
    # Two runs exhausted 30 minutes while Chromium was still progressing.
    # Include the Playwright webServer rebuild and runner variance;
    # keep a finite budget without dropping or parallelizing any gate.
    timeout-minutes: 60
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The planner reads the integrated publication base, never a draft
          # feature commit. A shallow PR checkout omits origin/main.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Astro and content
        run: npm run check

      - name: Exercise the blog forge
        run: npm run test:blog-pipeline

      - name: Exercise blog frame guards in Chromium
        run: node --test tests/scripts/blog-proof-frame-render.test.mjs

      - name: Exercise guide forge and proof geometry in Chromium
        run: npm run test:guide-forge && npm run test:guide-render

      - name: Build and run deterministic gates
        run: npm run build
        env:
          CF_PAGES: "1"

      - name: Run browser contracts
        run: npm run test
        env:
          CF_PAGES: "1"
