name: PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the Playwright browser used by render gates
        run: npx playwright install --with-deps chromium

      - name: Check Astro and content
        run: npm run check

      - name: Exercise the blog forge
        run: npm run test:blog-pipeline

      - name: Build and run deterministic gates
        run: npm run build
