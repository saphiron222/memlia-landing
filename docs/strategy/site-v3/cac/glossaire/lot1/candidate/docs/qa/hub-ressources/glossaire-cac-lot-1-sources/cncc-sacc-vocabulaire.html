</head><body><noscript><div class="container py-12"><h1 class="text-4xl mb-8">Services autres que la certification des comptes : Guide d'application à l'attention des entreprises, des comités d'audit, des conseils d'administration et de surveillance et des commissaires aux comptes</h1><div class="p-4 bg-slate-100 mb-8">Guide d'application relatif aux services autres que la certification des comptes  établi par la CNCC et les représentants des entreprises : Afep, Ansa, Medef et Middlenext. Ce guide s’adresse aux EIP et à leurs commissaires aux comptes et vise à les aider à appréhender les nouvelles règles et à préciser leurs modalités d’application dans le cadre de leur mise en œuvre. Il constitue un outil d’aide à l’approbation des services autres que la certification des comptes</div></div></noscript><div id="app"></div></body></html><!--{"type":["ouvrage"],"titre":"Services autres que la certification des comptes : Guide d'application à l'attention des entreprises, des comités d'audit, des conseils d'administration et de surveillance et des commissaires aux comptes","classe":"document","source":["dmf"],"statut":"en_cours","ouvrage":{"nom":"","page":"","date_publication":""},"secteur":[],"diffusion":"public","date_modif":"2018-11-15","description":"Guide d'application relatif aux services autres que la certification des comptes  établi par la CNCC et les représentants des entreprises : Afep, Ansa, Medef et Middlenext. Ce guide s’adresse aux EIP et à leurs commissaires aux comptes et vise à les aider à appréhender les nouvelles règles et à préciser leurs modalités d’application dans le cadre de leur mise en œuvre. Il constitue un outil d’aide à l’approbation des services autres que la certification des comptes","liens-outils":[],"avertissement":"","date_creation":"2018-11-15","liens-remplace":[{"nom":"guide-dapplication-relatif-aux-s","titre":"Guide d'application relatif aux services autres que la certification des comptes"}],"liens-documents":[],"date_publication":"2018-11-15","liens-remplace-par":[],"liens-avertissement":[],"publication_bulletin":false,"attachments":[{"type":"application-pdf","nom":"services-autres-que-la-certifica","date_publication":"2018-11-15","description":"Guide d'application relatif aux services autres que la certification des comptes  établi par la CNCC et les représentants des entreprises : Afep, Ansa, Medef et Middlenext. Ce guide s’adresse aux EIP et à leurs commissaires aux comptes et vise à les aider à appréhender les nouvelles règles et à préciser leurs modalités d’application dans le cadre de leur mise en œuvre. Il constitue un outil d’aide à l’approbation des services autres que la certification des comptes","statut":"en_cours","titre":"Communication commune CNCC Entreprises Guide SACC.pdf","url":"/docs/services-autres-que-la-certifica/attachments/communication-commune-cncc-entreprises-guide-sacc"},{"type":"application-pdf","nom":"services-autres-que-la-certifica","date_publication":"2018-11-15","description":"Guide d'application relatif aux services autres que la certification des comptes  établi par la CNCC et les représentants des entreprises : Afep, Ansa, Medef et Middlenext. Ce guide s’adresse aux EIP et à leurs commissaires aux comptes et vise à les aider à appréhender les nouvelles règles et à préciser leurs modalités d’application dans le cadre de leur mise en œuvre. Il constitue un outil d’aide à l’approbation des services autres que la certification des comptes","statut":"en_cours","titre":"Guide SACC.pdf","url":"/docs/services-autres-que-la-certifica/attachments/guide-sacc"}]}--><noscript><p class="officeconversion-standard">L’Afep, l’ANSA, le MEDEF, Middlenext et le Département EIP de la CNCC publient un guide relatif à la fourniture de services autres que la certification des comptes. </p>
    <p class="officeconversion-standard">L’ordonnance du 17 mars 2016 relative au commissariat aux comptes<a href="#ftn1" id="bodyftn1">1</a> a transposé la directive européenne du 16 avril 2014<a href="#ftn2" id="bodyftn2">2</a> concernant le contrôle légal des comptes annuels et consolidés et assuré la mise en conformité du droit français avec le règlement européen du même jour<a href="#ftn3" id="bodyftn3">3</a>, applicable depuis le 17 juin 2016, relatif aux exigences spécifiques liées au contrôle légal des comptes des entités d’intérêt public (EIP). Ces textes ont renforcé les obligations des commissaires aux comptes, notamment en matière d’indépendance et de désignation, ainsi que le rôle des comités d’audit des EIP. En particulier, la fourniture à une EIP, ou à une société de son groupe, de services autres que la certification des comptes (SACC) doit faire l’objet d’une approbation préalable par le comité d’audit de l’EIP. </p>
    <p class="officeconversion-standard">Ce guide constitue la version finale du guide publié sous forme provisoire en juillet 2016. Il intègre notamment les modifications apportées par la loi du 9 décembre 2016 relative à la transparence, à la lutte contre la corruption et à la modernisation de la vie économique, dite « Sapin 2 » et par le code révisé de déontologie de la profession de commissaire aux comptes. Ce guide mis à jour tient également compte des positions prises par le Haut conseil du Commissariat aux comptes (H3C) dans le domaine des SACC.</p>
    <p class="officeconversion-standard">Ce g<a id="GoBack"></a>uide, qui s’adresse aux entreprises, aux comités d'audit et aux conseils d'administration et de surveillance des EIP ainsi qu’à leurs commissaires aux comptes, constitue un outil d’aide à l’approbation des SACC, en : </p>
    <ul class="officeconversion-listlevel1wwnum2">
      <li>
        <p class="officeconversion-listparagraph" xml:lang="en-GB"><span xml:lang="fr-FR">explicitant les éléments du dispositif juridique et réglementaire mis en place depuis juin 2016 ;</span></p>
      </li>
      <li>
        <p class="officeconversion-listparagraph" xml:lang="en-GB"><span xml:lang="fr-FR">proposant des modalités pratiques de mise en œuvre permettant aux entreprises, à leur comité d’audit et aux commissaires aux comptes de se conformer à la loi.</span></p>
      </li>
    </ul>
    <p class="officeconversion-standard">Ce guide précise, notamment, le champ d’application territorial de l’interdiction de fournir certains services, les services susceptibles d’être confiés aux commissaires aux comptes, les cas d’approbation des SACC par le comité d’audit d’une EIP ainsi que les modalités de cette approbation. Il présente en particulier les conditions permettant la mise en œuvre d’une approbation par catégories de SACC.</p>
    <p class="officeconversion-standard">Il a fait l’objet d’échanges approfondis avec les autorités concernées afin de s’assurer d’une correcte compréhension des textes, notamment par le biais de saisines du H3C. Pour autant, ce guide n’engage que les associations et organisations signataires.</p>
    <p class="officeconversion-standard">Le guide est disponible sur les sites des différentes associations et organisations signataires.</p>
