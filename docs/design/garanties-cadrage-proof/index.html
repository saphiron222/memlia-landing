<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadrage et développement sur jeux fictifs</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
<section class="frame" id="cadrage-donnees" aria-label="Cadrage sur fichiers autorisés, développement sur jeux fictifs">
  <div class="pair-stage hatch">
    <article class="window">
      <div class="window-bar"><span class="dot"></span><span>Cadrage</span><small>Scène fictive</small></div>
      <div class="pair-window-body">
        <div class="item"><i>▤</i><span>Fichiers autorisés, lus en place</span></div>
        <div class="item"><i>◇</i><span>Accès défini avec le cabinet</span></div>
        <div class="item"><i>≡</i><span>Forme des données à reproduire</span></div>
      </div>
    </article>
    <div class="pair-link"><span>Construire sur du fictif</span><div class="arrow"></div><span class="none">∅ Fichiers réels hors dépôts</span></div>
    <article class="window">
      <div class="window-bar"><span class="dot green"></span><span>Développement</span><small>Jeu fictif</small></div>
      <div class="pair-window-body">
        <div class="item"><i>≡</i><span>La règle écrite</span></div>
        <div class="item"><i>◎</i><span>Un jeu d’essai entièrement fictif</span></div>
        <div class="item"><i>✓</i><span>Les critères de recette</span></div>
      </div>
    </article>
  </div>
</section>
</main></body></html>
